http_port 3128
visible_hostname intiligence-egress-proxy
# ICMP reachability probing is unnecessary for a forward proxy and requires raw-socket privileges.
pinger_enable off
pid_filename /run/squid/squid.pid
cache_log /dev/stderr
access_log /var/log/squid/access.log
cache deny all
cache_mem 16 MB
maximum_object_size_in_memory 0 KB
forwarded_for delete
httpd_suppress_version_string on

# Use Squid's built-in localhost and manager ACLs.
acl app_net src 172.30.0.0/24
acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443

# Permit only local cache-manager health checks before port restrictions.
http_access allow localhost manager
http_access deny manager
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Deny special-use and non-public IPv4 and IPv6 destinations.
# 255.255.255.255 is covered by 240.0.0.0/4.
acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
# Do not put ::ffff:0:0/96 here: Squid normalizes it to an IPv4 /0 ACL on this build.
acl blocked_dst dst ::/128 ::1/128 64:ff9b::/96 64:ff9b:1::/48 2001::/23 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 ff00::/8
# Squid normalizes IPv4-mapped IPv6 destinations to IPv4; the IPv4 ACL above covers them.
http_access deny blocked_dst
http_access allow app_net
http_access deny all

coredump_dir /var/cache/squid
