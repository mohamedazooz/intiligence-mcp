[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "omnipulse-mcp"
version = "0.1.0"
description = "Universal Research, Engineering & Intelligence Orchestrator MCP"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
dependencies = [
  "fastmcp>=4.2",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "pydantic-settings>=2.7",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0", "ruff>=0.12", "mypy>=1.15"]

[project.scripts]
omnipulse-mcp = "omnipulse.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnipulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
