[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "intiligence-mcp"
version = "0.1.0"
description = "Evidence-oriented intelligence research MCP server"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary application; third-party components retain their own licenses" }
dependencies = [
  "httpx>=0.28,<1",
  "courlan>=1.4.0",
  "htmldate>=1.11.0",
  "lxml>=6.1.3",
  "lxml-html-clean>=0.4.6",
  "justext>=3.0.2",
  "charset-normalizer>=3.5.2",
  "urllib3>=2.8.0,<3",
  "certifi",
  "mcp>=1.12,<2",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0", "ruff>=0.12", "mypy>=1.15"]

[project.scripts]
intiligence-mcp = "intiligence_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intiligence_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/intiligence_mcp/_vendor/**"]
